<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneBook</title>
<style>
/* ============================================================
   Design tokens
   ============================================================ */
:root{
  color-scheme: light;
  --sidebarW: 258px;
  --pagesW: 200px;

  --bg:#eceef3;
  --surface:#ffffff;
  --surface-2:#f6f7fa;
  --surface-3:#eceef4;
  --sidebar:#fafbfd;
  --page:#ffffff;

  --text:#1b1f27;
  --text-dim:#586072;
  --muted:#8b93a3;

  --line:#e4e7ee;
  --line-soft:#eef0f5;
  --line-strong:#d5dae4;

  --accent:#5b63e8;
  --accent-2:#8b6bf0;
  --accent-soft:#eceefe;
  --accent-ink:#ffffff;

  --danger:#d64545;
  --danger-soft:#fdecec;

  --shadow-1:0 1px 2px rgba(18,24,40,.05);
  --shadow-2:0 2px 6px rgba(18,24,40,.07), 0 1px 2px rgba(18,24,40,.04);
  --shadow-3:0 14px 34px -10px rgba(18,24,40,.26), 0 2px 6px rgba(18,24,40,.06);
  --shadow-paper:0 1px 2px rgba(18,24,40,.05), 0 16px 40px -18px rgba(18,24,40,.28);
}
html.dark{
  color-scheme: dark;
  --bg:#0f1116;
  --surface:#191c23;
  --surface-2:#1f232b;
  --surface-3:#262b34;
  --sidebar:#14171d;
  --page:#1b1e26;

  --text:#e7eaf0;
  --text-dim:#a4adbb;
  --muted:#79828f;

  --line:#262b34;
  --line-soft:#20242c;
  --line-strong:#333a45;

  --accent:#8b93ff;
  --accent-2:#b39bff;
  --accent-soft:rgba(139,147,255,.15);
  --accent-ink:#0f1116;

  --danger:#f07070;
  --danger-soft:rgba(240,112,112,.14);

  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 8px rgba(0,0,0,.45);
  --shadow-3:0 16px 40px -12px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.4);
  --shadow-paper:0 1px 3px rgba(0,0,0,.4), 0 20px 50px -22px rgba(0,0,0,.85);
}

/* ============================================================
   Base
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px;line-height:1.45;color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
[hidden]{display:none !important}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:transparent;cursor:pointer;border-radius:8px;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box;border:3px solid transparent}
::selection{background:var(--accent-soft);color:var(--text)}

#app{height:100vh;display:flex;flex-direction:column}

/* ============================================================
   Top bar
   ============================================================ */
#topbar{
  flex:0 0 50px;height:50px;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);
  position:relative;z-index:30;min-width:0;
}
#topbar #formatbar{
  flex:1 1 auto;min-width:0;height:50px;padding:0 4px;
  background:transparent;border:0;position:relative;z-index:auto;
}
.topActions{margin-left:auto;display:flex;align-items:center;gap:6px}

.iconBtn{
  height:33px;min-width:33px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--text-dim);transition:background .14s,color .14s;
}
.iconBtn:hover{background:var(--surface-3);color:var(--text)}
.iconBtn svg{width:16px;height:16px}

.pill{
  height:33px;padding:0 13px;display:inline-flex;align-items:center;gap:7px;
  border-radius:9px;font-size:13px;font-weight:600;color:var(--text-dim);
  transition:background .14s,color .14s,transform .08s,box-shadow .14s;
}
.pill svg{width:15px;height:15px}
.pill:hover{background:var(--surface-3);color:var(--text)}
.pill:active{transform:translateY(1px)}
.pill.primary{
  background:linear-gradient(140deg,var(--accent),var(--accent-2));
  color:#fff;box-shadow:0 3px 10px -3px rgba(91,99,232,.75);
}
.pill.primary:hover{filter:brightness(1.07);color:#fff}

/* ============================================================
   Format toolbar
   ============================================================ */
#formatbar{
  flex:0 0 auto;height:46px;display:flex;align-items:center;gap:3px;
  padding:0 12px;background:var(--surface-2);border-bottom:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;position:relative;z-index:20;
}
#formatbar::-webkit-scrollbar{height:0}

.toolBtn{
  flex:0 0 auto;height:32px;min-width:32px;padding:0 7px;
  display:inline-flex;align-items:center;justify-content:center;gap:3px;
  color:var(--text-dim);font-size:14px;line-height:1;
  transition:background .13s,color .13s;
}
.toolBtn:hover{background:var(--surface-3);color:var(--text)}
.toolBtn:active{background:var(--accent-soft)}
.toolBtn.on{background:var(--accent-soft);color:var(--accent)}
.toolBtn svg{width:17px;height:17px;display:block}
.toolBtn b{font-weight:800}
.toolBtn i{font-style:italic;font-family:Georgia,serif;font-size:15px}
.toolBtn u{text-decoration:underline;text-underline-offset:2px}
.toolBtn s{text-decoration:line-through}
.toolBtn sub,.toolBtn sup{font-size:9px}

.colorBtn{position:relative;padding-bottom:2px}
.colorBtn .swatch{
  position:absolute;left:7px;right:7px;bottom:5px;height:3px;border-radius:3px;
  background:var(--accent);transition:background .15s;
}
.colorBtn .glyphA{font-weight:700;font-size:15px;line-height:1;transform:translateY(-2px)}

.tbSep{flex:0 0 auto;width:1px;height:20px;background:var(--line-strong);margin:0 6px;opacity:.75}

.toolSelect{
  flex:0 0 auto;height:32px;border:1px solid var(--line);border-radius:9px;
  background-color:var(--surface);color:var(--text);
  padding:0 26px 0 10px;font-size:12.5px;appearance:none;outline:0;
  transition:border-color .14s,box-shadow .14s;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%238b93a3' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center;background-size:9px;
}
.toolSelect:hover{border-color:var(--line-strong)}
.toolSelect:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#fontFamily{width:142px}
#fontSize{width:66px}
#style{width:132px}

/* ============================================================
   Section bar
   ============================================================ */
#sectionbar{
  flex:0 0 42px;height:42px;display:flex;align-items:flex-end;
  background:var(--surface-2);border-bottom:1px solid var(--line);
  position:relative;z-index:15;
}
.sectionNotebookHeader{display:none}
.sectionTabsArea{
  display:flex;align-items:flex-end;gap:6px;padding:0 12px;min-width:0;width:100%;
  background:var(--surface-2);
}
#sectionTabs{
  display:flex;align-items:flex-end;gap:3px;height:100%;min-width:0;
  overflow-x:auto;scrollbar-width:none;padding-top:8px;
}
#sectionTabs::-webkit-scrollbar{display:none}

.sectionTab{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;
  height:34px;padding:0 9px 0 14px;min-width:98px;max-width:196px;
  border:1px solid transparent;border-bottom:0;border-radius:9px 9px 0 0;
  font-size:12.5px;font-weight:500;color:var(--text-dim);white-space:nowrap;
  transition:background .14s,color .14s;
}
.sectionTab:hover{background:rgba(128,140,168,.13);color:var(--text)}
.sectionTab.active{background:var(--page);border-color:var(--line);color:var(--text);font-weight:650}
.sectionTabTitle{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sectionRename{
  flex:0 0 auto;display:grid;place-items:center;width:22px;height:22px;border-radius:6px;
  opacity:.72;transition:opacity .14s,background .14s,color .14s;
  color:var(--muted);
}
.sectionRename svg{width:13px;height:13px;display:block}
.sectionRename:hover{opacity:1;background:rgba(128,140,168,.2);color:var(--text)}

#newSection{
  flex:0 0 auto;width:30px;height:30px;margin-bottom:4px;
  display:grid;place-items:center;color:var(--muted);transition:.14s;
}
#newSection svg{width:16px;height:16px}
#newSection:hover{background:rgba(128,140,168,.16);color:var(--accent)}

/* ============================================================
   Workspace
   ============================================================ */
#workspace{flex:1;min-height:0;display:grid;grid-template-columns:var(--sidebarW) minmax(0,1fr) var(--pagesW);transition:grid-template-columns .24s cubic-bezier(.2,.75,.25,1)}

/* ---------- Left: notebooks ---------- */
#notebookPane{position:relative;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:width .24s cubic-bezier(.2,.75,.25,1),background .18s,border-color .18s}
.searchWrap{position:relative;margin:12px 12px 8px;flex:0 0 auto;transition:opacity .16s,transform .24s;transform-origin:left center}
.searchWrap > svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted);pointer-events:none;display:block}
#search{
  width:100%;height:34px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);padding:0 10px 0 32px;font-size:12.5px;outline:0;
  transition:border-color .15s,box-shadow .15s;
}
#search::placeholder{color:var(--muted)}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

#notebookList{flex:1;min-height:0;overflow-y:auto;padding:2px 8px 14px;transition:padding .24s cubic-bezier(.2,.75,.25,1)}
.notebook{margin-bottom:3px;transition:margin .24s cubic-bezier(.2,.75,.25,1)}
.notebookHead{display:flex;align-items:center;gap:7px;min-height:36px;padding:4px 6px 4px 4px;border-radius:10px;cursor:pointer;color:var(--text);position:relative;transform-origin:center center;transition:width .24s cubic-bezier(.2,.75,.25,1),height .24s cubic-bezier(.2,.75,.25,1),min-height .24s cubic-bezier(.2,.75,.25,1),padding .24s cubic-bezier(.2,.75,.25,1),margin .24s cubic-bezier(.2,.75,.25,1),border-radius .2s,background .14s,color .14s,box-shadow .18s}
.notebookHead:hover{background:var(--surface-3)}
.notebookHead.active{background:var(--surface-3)}
.notebookHead.active .bookName{font-weight:700}
.notebookHead.active .bookIcon{color:var(--accent)}
.bookIcon{flex:0 0 auto;width:20px;height:20px;display:grid;place-items:center;color:var(--muted);transition:color .18s,transform .24s cubic-bezier(.2,.75,.25,1)}
.bookIcon svg{width:16px;height:16px}
.bookName{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:font-size .2s,transform .24s cubic-bezier(.2,.75,.25,1),max-height .24s}
.chev{
  flex:0 0 auto;width:20px;height:20px;display:grid;place-items:center;
  color:var(--muted);border-radius:6px;transition:background .13s;
}
.chev svg{width:12px;height:12px;transition:transform .16s ease}
.chev.open svg{transform:rotate(90deg)}
.chev:hover{background:var(--line);color:var(--text)}

.bookIcon{
  flex:0 0 auto;width:20px;height:20px;display:grid;place-items:center;
  color:var(--muted);transition:color .14s;
}
.bookIcon svg{width:16px;height:16px}
.bookName{
  flex:1;min-width:0;font-size:12.5px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

.rowMenu{
  flex:0 0 auto;width:24px;height:24px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;border-radius:7px;
  color:var(--muted);opacity:0;transition:opacity .13s,background .13s,color .13s;
}
.rowMenu span{width:3px;height:3px;border-radius:50%;background:currentColor}
.rowMenu:hover{background:var(--line);color:var(--text)}
.notebookHead:hover .rowMenu,.pageRow:hover .rowMenu,.pageRow.active .rowMenu{opacity:1}

.sectionList{
  margin:2px 0 6px 14px;padding-left:8px;border-left:1.5px solid var(--line);display:flex;flex-direction:column;gap:1px;
  max-height:900px;opacity:1;overflow:hidden;
  transition:max-height .24s cubic-bezier(.2,.75,.25,1),opacity .16s,margin .24s,padding .24s,border-color .18s;
}
.treeSectionRow{display:flex;align-items:center;border-radius:9px;transition:background .13s}
.treeSectionRow:hover{background:var(--surface-3)}
.treeSection{
  flex:1;min-width:0;display:flex;align-items:center;gap:9px;
  height:32px;padding:0 6px 0 10px;border-radius:9px;
  font-size:12.5px;color:var(--text-dim);text-align:left;transition:color .13s;
}
.treeSection:hover{color:var(--text)}
.treeSection.active{color:var(--accent);font-weight:650}
.secDot{
  position:relative;flex:0 0 auto;width:19px;height:13px;border-radius:2px 4px 4px 2px;
  opacity:.92;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
}
.secDot:before{
  content:"";position:absolute;left:2px;top:-3px;width:8px;height:4px;
  border-radius:2px 2px 0 0;background:inherit;
}
.treeSection.active .secDot{
  box-shadow:0 0 0 3px var(--accent-soft),inset 0 0 0 1px rgba(0,0,0,.08);
}
.treeSectionName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rowIconDel{
  flex:0 0 26px;width:26px;height:26px;margin-right:3px;display:grid;place-items:center;
  color:var(--muted);opacity:.72;border-radius:7px;
  transition:opacity .13s,background .13s,color .13s;
}
.rowIconDel svg{width:14px;height:14px;display:block}
.rowIconDel:hover{opacity:1;background:var(--danger-soft);color:var(--danger)}

.treePage{
  display:block;width:100%;text-align:left;padding:5px 10px 5px 26px;
  border-radius:8px;font-size:11.5px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:background .13s,color .13s;
}
.treePage:hover{background:var(--surface-3);color:var(--text)}

.emptyNote{padding:18px 12px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}

/* ---------- Collapsed notebooks: section tabs stood on end ----------
   Same chip as #sectionTabs. The whole chip rotates -90deg so the book
   icon sits at the bottom of the spine and the title reads upward.
   No 3D fold: that animation re-fired on every list rebuild. */
#workspace.notebook-collapsed{grid-template-columns:35px minmax(0,1fr) var(--pagesW)}
#workspace.notebook-collapsed #notebookPane{width:35px;border-right:1px solid var(--line)}
#workspace.notebook-collapsed .searchWrap{opacity:0;pointer-events:none;height:0;margin:0;overflow:hidden}
#workspace.notebook-collapsed #notebookList{padding:10px 0 52px;overflow-x:hidden;overflow-y:auto}
#workspace.notebook-collapsed .notebook{width:34px;height:118px;margin:0 0 4px;overflow:visible}
#workspace.notebook-collapsed .notebookHead{
  position:relative;
  width:118px;height:34px;min-height:34px;margin:0;
  padding:0 10px 0 12px;gap:7px;
  display:inline-flex;align-items:center;
  border:1px solid transparent;border-bottom:0;
  border-radius:9px 9px 0 0;
  background:transparent;box-shadow:none;
  transform:rotate(-90deg) translateX(-100%);
  transform-origin:top left;
  overflow:hidden;
}
#workspace.notebook-collapsed .notebookHead:hover{background:rgba(128,140,168,.13);color:var(--text)}
#workspace.notebook-collapsed .notebookHead.active{
  background:var(--page);border-color:var(--line);color:var(--text);
  box-shadow:none;
}
#workspace.notebook-collapsed .notebookHead.active:before{content:none}
#workspace.notebook-collapsed #notebookPane .chev,
#workspace.notebook-collapsed #notebookPane .rowMenu{display:none}
#workspace.notebook-collapsed .bookIcon{
  position:static;flex:0 0 auto;width:16px;height:16px;
  transform:none;margin:0;color:var(--muted);
}
#workspace.notebook-collapsed .notebookHead.active .bookIcon{color:var(--accent)}
#workspace.notebook-collapsed .bookIcon svg{width:16px;height:16px}
#workspace.notebook-collapsed .bookName{
  position:static;left:auto;top:auto;width:auto;height:auto;max-width:none;
  flex:1;min-width:0;display:block;
  font-size:12.5px;font-weight:500;line-height:1.2;text-align:left;
  transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#workspace.notebook-collapsed .notebookHead.active .bookName{font-weight:650}
#workspace.notebook-collapsed .sectionList{max-height:0;opacity:0;margin:0;padding:0;border-left-color:transparent;pointer-events:none}
#workspace.notebook-collapsed .paneFooter{position:absolute;left:0;right:0;bottom:0;height:48px;padding:5px;border-top:1px solid var(--line);background:var(--sidebar);display:flex;align-items:center;justify-content:center}
#workspace.notebook-collapsed .paneFooter .ghostBtn{display:none}
.notebookToggle{flex:0 0 30px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--muted);transition:background .14s,color .14s,border-color .14s}
.notebookToggle:hover{background:var(--surface-3);color:var(--text);border-color:var(--line-strong)}
.notebookToggle svg{width:14px;height:14px}
#workspace.notebook-collapsed .notebookToggle svg{transform:rotate(180deg)}

.paneFooter{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--line);
}
.ghostBtn{
  flex:1;height:30px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);background:var(--surface);border-radius:9px;
  color:var(--text-dim);font-size:11.5px;font-weight:600;white-space:nowrap;
  transition:border-color .14s,color .14s,background .14s;
}
.ghostBtn svg{width:12px;height:12px}
.ghostBtn:hover{border-color:var(--line-strong);color:var(--text);background:var(--surface-2)}

/* ---------- Middle: page canvas ---------- */
#pageCanvas{
  min-width:0;overflow:auto;background:var(--bg);padding:26px 34px 90px;
  scroll-behavior:smooth;
}
#page{
  width:min(100%,880px);margin:0 auto;background:var(--page);
  border:1px solid var(--line-soft);border-radius:14px;
  box-shadow:var(--shadow-paper);padding:40px 54px 56px;
  min-height:calc(100vh - 230px);
}
#pageTitle{
  display:block;width:100%;border:0;background:transparent;outline:0;
  font-size:30px;font-weight:750;letter-spacing:-.025em;line-height:1.2;
  color:var(--text);padding:4px 6px;border-radius:9px;margin:0 0 4px;
  transition:background .15s;
}
#pageTitle::placeholder{color:var(--muted);opacity:.55;font-weight:600}
#pageTitle:hover{background:var(--surface-2)}
#pageTitle:focus{background:var(--surface-2)}

#pageMeta{
  display:flex;align-items:center;flex-wrap:wrap;gap:8px;
  font-size:11px;color:var(--muted);
  padding:0 6px 16px;border-bottom:1px solid var(--line-soft);margin-bottom:22px;
}
.metaChip{font-weight:650;color:var(--text-dim)}
.metaDot{width:3px;height:3px;border-radius:50%;background:var(--muted);opacity:.65}

#editor{
  outline:0;min-height:460px;font-size:15px;line-height:1.72;color:var(--text);
  padding:0 6px;
}
#editor:empty:before{content:"Start writing…";color:var(--muted);opacity:.6}
#editor p{margin:0 0 .78em}
#editor h1{font-size:25px;font-weight:750;letter-spacing:-.02em;margin:.7em 0 .35em;line-height:1.25}
#editor h2{font-size:19.5px;font-weight:700;letter-spacing:-.012em;margin:.85em 0 .35em;line-height:1.3}
#editor h3{font-size:16px;font-weight:700;margin:.9em 0 .3em;line-height:1.35}
#editor ul,#editor ol{margin:.35em 0 .85em;padding-left:26px}
#editor li{margin:.18em 0}
#editor blockquote{
  margin:.9em 0;padding:8px 0 8px 18px;border-left:3px solid var(--accent);
  color:var(--text-dim);font-style:italic;
}
#editor pre{
  margin:.9em 0;padding:13px 16px;border-radius:11px;
  background:var(--surface-2);border:1px solid var(--line);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;line-height:1.6;overflow:auto;
}
#editor code{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;
  background:var(--surface-2);border:1px solid var(--line-soft);
  padding:1px 5px;border-radius:5px;
}
#editor a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
#editor img{max-width:100%;border-radius:10px}
#editor hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}

/* ---------- Drawing layer ---------- */
#page{position:relative}
#drawingLayer{
  position:absolute;inset:0;width:100%;height:100%;z-index:8;
  pointer-events:none;touch-action:none;
}
#drawingLayer.active{pointer-events:auto;cursor:crosshair}
#drawingLayer svg{display:block;width:100%;height:100%;overflow:visible}
#drawingLayer path{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.drawOnly{display:none}
body.drawingMode .drawOnly{display:inline-flex}
body.drawingMode #drawToggle{background:var(--accent-soft);color:var(--accent)}
.drawTool.on{background:var(--accent-soft);color:var(--accent)}
.drawWidth{min-width:68px}
.drawIndicator{
  position:absolute;right:16px;top:14px;z-index:20;pointer-events:none;
  padding:5px 9px;border-radius:8px;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow-2);
  color:var(--text-dim);font-size:10.5px;font-weight:650;
  opacity:0;transform:translateY(-4px);transition:opacity .14s,transform .14s;
}
body.drawingMode .drawIndicator{opacity:1;transform:none}

#tags{
  display:block;width:100%;border:0;border-top:1px solid var(--line-soft);
  background:transparent;outline:0;padding:14px 6px 0;margin-top:32px;
  font-size:12px;color:var(--text-dim);
}
#tags::placeholder{color:var(--muted)}

#emptyState{padding:70px 0;display:flex;justify-content:center}
.emptyCard{max-width:340px;text-align:center;color:var(--muted)}
.emptyIcon{
  width:54px;height:54px;margin:0 auto 18px;border-radius:16px;
  display:grid;place-items:center;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow-1);color:var(--accent);
}
.emptyIcon svg{width:24px;height:24px}
.emptyCard h2{margin:0 0 8px;font-size:16px;font-weight:700;color:var(--text)}
.emptyCard p{margin:0 0 20px;font-size:13px;line-height:1.6}
.emptyCard .pill{margin:0 auto}

/* ---------- Right: pages ---------- */
#pagePane{
  background:var(--sidebar);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.paneHead{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:14px 14px 8px;
}
.paneTitle{
  font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);
}
.countBadge{
  margin-left:auto;min-width:20px;height:19px;padding:0 6px;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:99px;background:var(--surface-3);color:var(--text-dim);
  font-size:10.5px;font-weight:700;
}
.newPageBtn{
  flex:0 0 auto;margin:0 12px 8px;height:34px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--line);border-radius:10px;background:var(--surface);
  color:var(--text-dim);font-size:12.5px;font-weight:650;
  transition:border-color .14s,color .14s,background .14s;
}
.newPageBtn svg{width:14px;height:14px}
.newPageBtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

#pageTabs{flex:1;min-height:0;overflow-y:auto;padding:2px 9px 16px}
.pageRow{
  position:relative;display:flex;align-items:center;
  border-radius:11px;margin-bottom:3px;transition:background .14s,box-shadow .14s;
}
.pageRow:hover{background:var(--surface-3)}
.pageRow.active{background:var(--surface);box-shadow:var(--shadow-2)}
.pageRow.active:before{
  content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;
  border-radius:0 3px 3px 0;background:var(--accent);
}
.pageTab{
  flex:1;min-width:0;text-align:left;
  padding:9px 30px 9px 12px;border-radius:11px;
  font-size:12.5px;color:var(--text-dim);line-height:1.35;
}
.pageRow.active .pageTab{color:var(--text);font-weight:650}
.pageTabText{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pageTab small{display:block;font-size:10px;font-weight:500;color:var(--muted);margin-top:3px}
.pageRow .rowMenu{position:absolute;right:5px;top:50%;transform:translateY(-50%)}

/* ============================================================
   Popovers & menus
   ============================================================ */
.cardMenu{
  position:fixed;z-index:9000;min-width:178px;padding:5px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow-3);
  animation:pop .13s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{opacity:0;transform:translateY(-5px) scale(.97)}}
.cardMenu button{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:8px 10px;border-radius:8px;font-size:13px;
  color:var(--text);text-align:left;transition:background .12s;
}
.cardMenu button svg{width:14px;height:14px;opacity:.75}
.cardMenu button:hover{background:var(--surface-3)}
.cardMenu .danger{color:var(--danger)}
.cardMenu .danger:hover{background:var(--danger-soft)}
.cardMenu .menuSep{height:1px;margin:4px 6px;background:var(--line)}

.popover{
  position:fixed;z-index:9000;display:grid;grid-template-columns:repeat(5,1fr);
  gap:6px;padding:9px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-3);
  animation:pop .13s cubic-bezier(.2,.9,.3,1.2);
}
.swatch{
  width:22px;height:22px;border-radius:7px;border:1px solid rgba(0,0,0,.12);
  transition:transform .12s,box-shadow .12s;
}
.swatch:hover{transform:scale(1.15);box-shadow:0 0 0 3px var(--accent-soft)}
.swatchNone{
  background:
    linear-gradient(45deg,transparent 44%,var(--danger) 44%,var(--danger) 56%,transparent 56%),
    var(--surface-2);
}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width:1180px){
  :root{--sidebarW:222px;--pagesW:178px}
  #page{padding:32px 38px 46px}
}
@media (max-width:940px){
  :root{--sidebarW:222px;--pagesW:0px}
  #pagePane{display:none}
  #page{padding:28px 28px 40px}
  #pageCanvas{padding:20px 18px 70px}
}

e":"Reference","favorite":false,"created":1789680000000,"modified":1789680000000,"tags":["reference"],"body":"<h2>Reference</h2><p>Keep useful facts, procedures, links and other material here for quick reference.</p><ol><li>Record the information.</li><li>Add enough context to make it useful later.</li><li>Update it when the source changes.</li></ol>"},{"id":"page-code-example","title":"Code Example","created":1789680000000,"modified":"2026-09-18T00:02:00.000Z","sectionId":"reference","content":"<h2>Code Example</h2><p>Code can be kept alongside ordinary notes and reference material.</p><pre><code>function greet(name) {\n  const message = `Hello, ${name}!`;\n  console.log(message);\n}\n\ngreet('OneBook');</code></pre>"}]}</script>

/* ============================================================
   State
   ============================================================ */
let db = JSON.parse(DATA.textContent);
let currentNotebook = db.notebooks[0] ? db.notebooks[0].id : null;
let currentSection  = db.notebooks[0]?.sections[0]?.id || null;
let currentPage     = null;
const openBooks     = {};
let searchTerm      = "";
let notebookCollapsed = store.get("onebook-notebook-collapsed") === "1";
let saveTimer       = null;
let lastTextColor   = "#5b63e8";
let drawMode        = false;
let drawTool        = "pen";
let drawColor       = "#1b1f27";
let drawWidth       = 4;
let drawingPointer  = null;
let historyUndo = [];
let historyRedo = [];
let historyApplying = false;
let historyTimer = null;
let historyLastSnapshot = null;

db.notebooks.forEach(n => openBooks[n.id] = true);

/* ============================================================
   Data helpers
   ============================================================ */
function notebook(){ return db.notebooks.find(n => n.id === currentNotebook) || null; }
function sectionsOf(nb){ return ((nb && nb.sections) || []).slice().sort((a,b) => (a.order||0) - (b.order||0)); }
function section(){ return sectionsOf(notebook()).find(s => s.id === currentSection) || null; }
function pages(){ return db.pages.filter(p => p.section === currentSection); }
function pageObj(){ return db.pages.find(p => p.id === currentPage) || null; }

function saveData(){ DATA.textContent = JSON.stringify(db, null, 2); }
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveData, 250); }

function ensure(){
  if(!db.notebooks || !db.notebooks.length){
    db.notebooks = [{ id:"nb-main", name:"OneBook", sections:[{ id:"sec-main", name:"General", order:0 }] }];
  }
  if(!notebook()) currentNotebook = db.notebooks[0].id;
  const nb = notebook();
  if(!nb.sections || !nb.sections.length){
    nb.sections = [{ id:"sec-"+Date.now().toString(36), name:"General", order:0 }];
  }
  if(!nb.sections.some(s => s.id === currentSection)) currentSection = sectionsOf(nb)[0].id;
  const list = pages();
  if(!list.some(p => p.id === currentPage)) currentPage = list[0] ? list[0].id : null;
}

function uid(prefix){ return prefix + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function fmtDate(ts){
  if(!ts) return "";
  const d = new Date(ts), now = new Date();
  if(d.toDateString() === now.toDateString()){
    return d.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
  }
  return d.toLocaleDateString([], { month:"short", day:"numeric" });
}

/* ============================================================
   Rendering
   ============================================================ */
function applyNotebookPaneState(){
  const workspace = $("workspace");
  workspace.classList.toggle("notebook-collapsed", notebookCollapsed);
  const toggle = $("notebookToggle");
  toggle.innerHTML = notebookCollapsed
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
  toggle.title = notebookCollapsed ? "Expand notebook sidebar" : "Collapse notebook sidebar";
  toggle.setAttribute("aria-label", toggle.title);
}

function renderAll(){
  ensure();
  applyNotebookPaneState();
  renderNotebooks();
  renderSections();
  renderPages();
  loadPage();
  saveData();
}


function renderNotebooks(){
  const list = $("notebookList");
  list.innerHTML = "";
  const q = searchTerm.trim().toLowerCase();
  const hit = t => !q || String(t ?? "").toLowerCase().includes(q);
  let shown = 0;

  db.notebooks.forEach(nb => {
    const nbHit = !!q && hit(nb.name);
    const secs = sectionsOf(nb);
    const entries = [];

    secs.forEach(sec => {
      const secHit = hit(sec.name);
      const matched = db.pages.filter(p => p.section === sec.id && hit(p.title || ""));
      if(!q || nbHit || secHit || matched.length) entries.push({ sec, matched: q ? matched : [] });
    });

    if(q && !entries.length) return;
    shown++;

    const wrap = document.createElement("div");
    wrap.className = "notebook";

    const isOpen = q ? true : !!openBooks[nb.id];

    /* --- header row --- */
    const head = document.createElement("div");
    head.className = "notebookHead" + (nb.id === currentNotebook ? " active" : "");

    const chev = document.createElement("button");
    chev.type = "button";
    chev.className = "chev" + (isOpen ? " open" : "");
    chev.innerHTML = ICON.chevron;
    chev.title = isOpen ? "Collapse" : "Expand";
    chev.addEventListener("click", e => {
      e.stopPropagation();
      openBooks[nb.id] = !openBooks[nb.id];
      renderNotebooks();
    });

    const book = document.createElement("span");
    book.className = "bookIcon";
    book.innerHTML = ICON.book;

    const name = document.createElement("span");
    name.className = "bookName";
    name.textContent = nb.name || "Untitled notebook";

    const menu = document.createElement("button");
    menu.type = "button";
    menu.className = "rowMenu";
    menu.innerHTML = ICON.dots;
    menu.title = "Notebook options";
    menu.addEventListener("click", e => {
      e.stopPropagation();
      showCardMenu(menu, nb.id, "book");
    });

    head.append(chev, book, name, menu);
    head.addEventListener("click", () => {
      currentNotebook = nb.id;
      openBooks[nb.id] = true;
      currentSection = sectionsOf(nb)[0] ? sectionsOf(nb)[0].id : null;
      currentPage = null;
      renderAll();
    });

    wrap.appendChild(head);

    /* --- sections --- */
    if(isOpen){
      const sl = document.createElement("div");
      sl.className = "sectionList";

      entries.forEach(({ sec, matched }) => {
        const row = document.createElement("div");
        row.className = "treeSectionRow";

        const b = document.createElement("button");
        b.type = "button";
        b.className = "treeSection" + (sec.id === currentSection ? " active" : "");
        const color = SECTION_COLORS[Math.max(0, secs.indexOf(sec)) % SECTION_COLORS.length];
        b.innerHTML = '<span class="secDot" style="background:' + color + '"></span>' +
                      '<span class="treeSectionName">' + esc(sec.name) + '</span>';
        b.addEventListener("click", e => {
          e.stopPropagation();
          currentNotebook = nb.id;
          currentSection = sec.id;
          currentPage = null;
          renderAll();
        });

        const del = document.createElement("button");
        del.type = "button";
        del.className = "rowIconDel";
        del.innerHTML = ICON.trash;
        del.title = "Delete section";
        del.addEventListener("click", e => {
          e.stopPropagation();
          deleteSectionById(sec.id);
        });

        row.append(b, del);
        sl.appendChild(row);

        matched.forEach(p => {
          const pr = document.createElement("button");
          pr.type = "button";
          pr.className = "treePage";
          pr.textContent = p.title || "Untitled page";
          pr.addEventListener("click", e => {
            e.stopPropagation();
            currentNotebook = nb.id;
            currentSection = p.section;
            currentPage = p.id;
            renderAll();
          });
          sl.appendChild(pr);
        });
      });

      wrap.appendChild(sl);
    }

    list.appendChild(wrap);
  });

  if(!shown){
    list.innerHTML = '<div class="emptyNote">No matches for “' + esc(searchTerm.trim()) + '”</div>';
  }
}

function renderSections(){
  const box = $("sectionTabs");
  box.innerHTML = "";
  sectionsOf(notebook()).forEach(sec => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "sectionTab" + (sec.id === currentSection ? " active" : "");
    b.innerHTML = '<span class="sectionTabTitle">' + esc(sec.name) + '</span>' +
                  '<span class="sectionRename" title="Rename section">' + ICON.pencil + '</span>';
    b.addEventListener("click", () => {
      currentSection = sec.id;
      currentPage = null;
      renderAll();
    });
    b.querySelector(".sectionRename").addEventListener("click", e => {
      e.stopPropagation();
      renameSection(sec.id);
    });
    box.appendChild(b);
  });
}

function renderPages(){
  const box = $("pageTabs");
  box.innerHTML = "";
  const list = pages();
  $("pageCount").textContent = list.length;

  if(!list.length){
    box.innerHTML = '<div class="emptyNote">This section is empty.<br>Create a page to get started.</div>';
    return;
  }

  list.forEach(p => {
    const row = document.createElement("div");
    row.className = "pageRow" + (p.id === currentPage ? " active" : "");

    const b = document.createElement("button");
    b.type = "button";
    b.className = "pageTab";
    b.innerHTML = '<span class="pageTabText">' + esc(p.title || "Untitled page") + '</span>' +
                  '<small>' + esc(fmtDate(p.modified || p.created)) + '</small>';
    b.addEventListener("click", () => { currentPage = p.id; renderAll(); });

    const menu = document.createElement("button");
    menu.type = "button";
    menu.className = "rowMenu";
    menu.innerHTML = ICON.dots;
    menu.title = "Page options";
    menu.addEventListener("click", e => {
      e.stopPropagation();
      showCardMenu(menu, p.id, "page");
    });

    row.append(b, menu);
    box.appendChild(row);
  });
}

function loadPage(){
  const p = pageObj();
  $("page").hidden = !p;
  $("emptyState").hidden = !!p;
  if(!p){
    $("pageTitle").value = "";
    $("editor").innerHTML = "";
    $("tags").value = "";
    $("pageMeta").innerHTML = "";
    return;
  }
  $("pageTitle").value = p.title || "";
  $("editor").innerHTML = p.body || "";
  $("tags").value = (p.tags || []).join(", ");
  historyReset();
  renderDrawings();
  updateMeta();
}

function updateMeta(){
  const p = pageObj();
  if(!p){ $("pageMeta").innerHTML = ""; return; }
  const words = (($("editor").innerText || "").trim().match(/\S+/g) || []).length;
  const nb = notebook() ? notebook().name : "";
  const sec = section() ? section().name : "";
  $("pageMeta").innerHTML =
    '<span class="metaChip">' + esc(nb) + '</span>' +
    '<span class="metaDot"></span>' +
    '<span class="metaChip">' + esc(sec) + '</span>' +
    '<span class="metaDot"></span>' +
    '<span>Edited ' + esc(new Date(p.modified || Date.now()).toLocaleString()) + '</span>' +
    '<span class="metaDot"></span>' +
    '<span>' + words + (words === 1 ? ' word' : ' words') + '</span>';
}

/* ============================================================
   Unified page history
   ============================================================ */
function historySnapshot(){
  const p = pageObj();
  if(!p) return null;
  return {
    title: $("pageTitle").value,
    body: $("editor").innerHTML,
    tags: $("tags").value,
    drawing: JSON.parse(JSON.stringify(p.drawing || []))
  };
}

function historyEqual(a,b){
  return !!a && !!b &&
    a.title === b.title &&
    a.body === b.body &&
    a.tags === b.tags &&
    JSON.stringify(a.drawing) === JSON.stringify(b.drawing);
}

function historyReset(){
  historyUndo = [];
  historyRedo = [];
  historyLastSnapshot = historySnapshot();
  updateHistoryButtons();
}

function historyCapture(){
  if(historyApplying) return;
  const snap = historySnapshot();
  if(!snap) return;
  if(!historyLastSnapshot){
    historyLastSnapshot = snap;
    return;
  }
  if(historyEqual(historyLastSnapshot, snap)) return;
  historyUndo.push(historyLastSnapshot);
  if(historyUndo.length > 100) historyUndo.shift();
  historyRedo = [];
  historyLastSnapshot = snap;
  updateHistoryButtons();
}

function historyCaptureSoon(){
  clearTimeout(historyTimer);
  historyTimer = setTimeout(historyCapture, 0);
}

function restoreHistorySnapshot(snap){
  const p = pageObj();
  if(!p || !snap) return;
  historyApplying = true;
  $("pageTitle").value = snap.title;
  $("editor").innerHTML = snap.body;
  $("tags").value = snap.tags;
  p.title = snap.title;
  p.body = snap.body;
  p.tags = snap.tags.split(",").map(x => x.trim()).filter(Boolean);
  p.drawing = JSON.parse(JSON.stringify(snap.drawing || []));
  p.modified = Date.now();
  historyApplying = false;
  historyLastSnapshot = historySnapshot();
  renderDrawings();
  renderPages();
  updateMeta();
  saveSoon();
  updateHistoryButtons();
}

function undoPage(){
  if(!historyUndo.length) return;
  const current = historySnapshot();
  const previous = historyUndo.pop();
  if(current) historyRedo.push(current);
  restoreHistorySnapshot(previous);
}

function redoPage(){
  if(!historyRedo.length) return;
  const current = historySnapshot();
  const next = historyRedo.pop();
  if(current) historyUndo.push(current);
  restoreHistorySnapshot(next);
}

function updateHistoryButtons(){
  $("undo").disabled = historyUndo.length === 0;
  $("redo").disabled = historyRedo.length === 0;
  $("undo").style.opacity = historyUndo.length ? "" : ".38";
  $("redo").style.opacity = historyRedo.length ? "" : ".38";
}

/* ============================================================
   Editing / persistence
   ============================================================ */
function commit(opts){
  const p = pageObj();
  if(!p) return;
  p.title  = $("pageTitle").value;
  p.body   = $("editor").innerHTML;
  p.tags   = $("tags").value.split(",").map(s => s.trim()).filter(Boolean);
  p.modified = Date.now();
  saveSoon();
  if(!historyApplying) historyCapture();
  if(opts && opts.list) renderPages();
  if(opts && opts.meta) updateMeta();
}

/* ============================================================
   Creation / deletion
   ============================================================ */
function newPage(){
  ensure();
  const id = uid("p");
  db.pages.push({
    id, section: currentSection, title: "", favorite: false,
    created: Date.now(), modified: Date.now(), tags: [], body: ""
  });
  currentPage = id;
  renderAll();
  const t = $("pageTitle");
  t.focus();
  t.select();
}

function newSection(){
  const nb = notebook();
  if(!nb) return;
  const id = uid("sec");
  nb.sections.push({ id, name: "New section", order: nb.sections.length });
  currentSection = id;
  currentPage = null;
  renderAll();
}

function newNotebook(){
  const id  = uid("nb");
  const sid = uid("sec");
  db.notebooks.push({ id, name: "New notebook", sections: [{ id: sid, name: "General", order: 0 }] });
  currentNotebook = id;
  currentSection = sid;
  currentPage = null;
  openBooks[id] = true;
  renderAll();
}

function renameSection(id){
  const nb = db.notebooks.find(n => (n.sections || []).some(s => s.id === id));
  if(!nb) return;
  const sec = nb.sections.find(s => s.id === id);
  if(!sec) return;
  const v = prompt("Section name:", sec.name || "Untitled section");
  if(v === null) return;
  const name = v.trim();
  if(!name) return;
  sec.name = name;
  renderAll();
}

function renamePageById(id){
  const p = db.pages.find(x => x.id === id);
  if(!p) return;
  const v = prompt("Page title:", p.title || "Untitled page");
  if(v === null) return;
  const name = v.trim();
  if(!name) return;
  p.title = name;
  p.modified = Date.now();
  renderAll();
}

function renameNotebook(id){
  const nb = db.notebooks.find(x => x.id === id);
  if(!nb) return;
  const v = prompt("Notebook name:", nb.name || "Untitled notebook");
  if(v === null) return;
  const name = v.trim();
  if(!name) return;
  nb.name = name;
  renderAll();
}

function deleteNotebookById(id){
  if(db.notebooks.length <= 1){ alert("You can’t delete the last notebook."); return; }
  const nb = db.notebooks.find(x => x.id === id);
  if(!nb) return;
  if(!confirm('Delete notebook “' + (nb.name || "Untitled notebook") + '” and all of its pages?')) return;

  const ids = new Set((nb.sections || []).map(s => s.id));
  db.pages = db.pages.filter(p => !ids.has(p.section));
  db.notebooks = db.notebooks.filter(x => x.id !== id);

  if(currentNotebook === id){
    currentNotebook = db.notebooks[0].id;
    currentSection  = sectionsOf(db.notebooks[0])[0] ? sectionsOf(db.notebooks[0])[0].id : null;
    currentPage     = null;
  }
  renderAll();
}

function deleteSectionById(id){
  const nb = db.notebooks.find(n => (n.sections || []).some(s => s.id === id));
  if(!nb) return;
  if((nb.sections || []).length <= 1){ alert("You can’t delete the last section in a notebook."); return; }
  const sec = nb.sections.find(s => s.id === id);
  if(!sec) return;
  if(!confirm('Delete section “' + (sec.name || "Untitled section") + '” and its pages?')) return;

  nb.sections = nb.sections.filter(s => s.id !== id);
  db.pages = db.pages.filter(p => p.section !== id);

  if(currentSection === id){
    currentSection = sectionsOf(nb)[0] ? sectionsOf(nb)[0].id : null;
    currentPage = null;
  }
  renderAll();
}

function deletePageById(id){
  const i = db.pages.findIndex(p => p.id === id);
  if(i < 0) return;
  db.pages.splice(i, 1);
  if(currentPage === id){
    const list = pages();
    currentPage = list[0] ? list[0].id : null;
  }
  renderAll();
}

/* ============================================================
   Card menu
   ============================================================ */
let cardMenu = null;
function closeCardMenu(){ if(cardMenu){ cardMenu.remove(); cardMenu = null; } }

function showCardMenu(anchor, id, type){
  closeCardMenu();
  const menu = document.createElement("div");
  menu.className = "cardMenu";

  const rename = document.createElement("button");
  rename.type = "button";
  rename.innerHTML = ICON.pencil + "<span>Rename</span>";
  rename.addEventListener("click", e => {
    e.stopPropagation();
    closeCardMenu();
    if(type === "book") renameNotebook(id); else renamePageById(id);
  });

  const del = document.createElement("button");
  del.type = "button";
  del.className = "danger";
  del.innerHTML = ICON.trash + "<span>" + (type === "book" ? "Delete notebook" : "Delete page") + "</span>";
  del.addEventListener("click", e => {
    e.stopPropagation();
    closeCardMenu();
    if(type === "book") deleteNotebookById(id); else deletePageById(id);
  });

  menu.append(rename, del);
  document.body.appendChild(menu);
  cardMenu = menu;

  const r = anchor.getBoundingClientRect();
  const w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.right - w)) + "px";
  menu.style.top  = Math.max(8, Math.min(window.innerHeight - h - 8, r.bottom + 6)) + "px";
}

/* ============================================================
   Colour popovers
   ============================================================ */
let popover = null;
function closePopover(){ if(popover){ popover.remove(); popover = null; } }

function openPopover(anchor, items, onPick){
  closePopover();
  const pop = document.createElement("div");
  pop.className = "popover";

  items.forEach(it => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "swatch" + (it.none ? " swatchNone" : "");
    b.title = it.label || it.value;
    if(!it.none) b.style.background = it.value;
    b.addEventListener("click", e => {
      e.stopPropagation();
      onPick(it.value);
      closePopover();
    });
    pop.appendChild(b);
  });

  document.body.appendChild(pop);
  popover = pop;

  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left)) + "px";
  pop.style.top  = Math.min(window.innerHeight - h - 8, r.bottom + 8) + "px";
}

const TEXT_COLORS = [
  "#1b1f27","#586072","#d64545","#e0642f","#d99a00",
  "#2e9e5b","#0ea5e9","#5b63e8","#8b5cf6","#d946a6"
];
const HIGHLIGHT_COLORS = [
  "#fff3a3","#ffe0b3","#ffd6e7","#e2d4ff","#bfe3ff",
  "#c8f7c5","#ffd0d0","#e6e8ec"
];

/* ============================================================
   Drawing
   ============================================================ */
function drawingPage(){
  const p = pageObj();
  if(!p) return null;
  if(!Array.isArray(p.drawing)) p.drawing = [];
  return p;
}

function drawingSize(){
  const layer = $("drawingLayer");
  return { w: Math.max(1, layer.clientWidth), h: Math.max(1, layer.clientHeight) };
}

function renderDrawings(){
  const svg = $("drawingSvg");
  if(!svg) return;
  const {w,h} = drawingSize();
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.innerHTML = "";
  const p = drawingPage();
  if(!p) return;
  (p.drawing || []).forEach(stroke => {
    if(!stroke.points || stroke.points.length < 2) return;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const d = stroke.points.map((pt,i) => {
      const x = Math.max(0, Math.min(1, pt[0])) * w;
      const y = Math.max(0, Math.min(1, pt[1])) * h;
      return (i ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2);
    }).join(" ");
    path.setAttribute("d", d);
    path.setAttribute("stroke", stroke.color || drawColor);
    path.setAttribute("stroke-width", String(stroke.width || 4));
    path.setAttribute("opacity", String(stroke.opacity == null ? 1 : stroke.opacity));
    path.setAttribute("vector-effect", "non-scaling-stroke");
    svg.appendChild(path);
  });
}

function setDrawMode(on){
  drawMode = !!on;
  document.body.classList.toggle("drawingMode", drawMode);
  $("drawingLayer").classList.toggle("active", drawMode);
  $("drawToggle").setAttribute("aria-pressed", drawMode ? "true" : "false");
  if(drawMode){
    closeCardMenu();
    closePopover();
    renderDrawings();
  } else {
    drawingPointer = null;
  }
}

function setDrawTool(tool){
  drawTool = tool;
  ["drawPen","drawHighlighter","drawEraser"].forEach(id => $(id).classList.remove("on"));
  const id = tool === "pen" ? "drawPen" : tool === "highlighter" ? "drawHighlighter" : "drawEraser";
  $(id).classList.add("on");
  $("drawingLayer").style.cursor = tool === "eraser" ? "cell" : "crosshair";
}

function clearDrawings(){
  const p = drawingPage();
  if(!p || !p.drawing || !p.drawing.length) return;
  if(!confirm("Clear all drawings from this page?")) return;
  historyCapture();
  p.drawing = [];
  p.modified = Date.now();
  historyCapture();
  saveSoon();
  renderDrawings();
  renderPages();
  updateMeta();
}

function pointerPoint(e){
  const r = $("drawingLayer").getBoundingClientRect();
  return [
    Math.max(0, Math.min(1, (e.clientX - r.left) / Math.max(1, r.width))),
    Math.max(0, Math.min(1, (e.clientY - r.top) / Math.max(1, r.height)))
  ];
}

function pointDistance(ax,ay,bx,by,px,py){
  const dx=bx-ax, dy=by-ay;
  if(dx===0 && dy===0) return Math.hypot(px-ax,py-ay);
  const t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy)));
  return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}

function eraseAt(pt){
  const p = drawingPage();
  if(!p || !p.drawing) return;
  const {w,h} = drawingSize();
  const px=pt[0]*w, py=pt[1]*h;
  const threshold=14;
  for(let i=p.drawing.length-1;i>=0;i--){
    const s=p.drawing[i];
    for(let j=1;j<s.points.length;j++){
      const a=s.points[j-1], b=s.points[j];
      if(pointDistance(a[0]*w,a[1]*h,b[0]*w,b[1]*h,px,py) <= threshold + (s.width||4)/2){
        historyCapture();
        p.drawing.splice(i,1);
        p.modified = Date.now();
        historyCapture();
        saveSoon();
        renderDrawings();
        renderPages();
        updateMeta();
        return;
      }
    }
  }
}

function bindDrawing(){
  $("drawToggle").addEventListener("click", () => setDrawMode(!drawMode));
  $("drawPen").addEventListener("click", () => setDrawTool("pen"));
  $("drawHighlighter").addEventListener("click", () => setDrawTool("highlighter"));
  $("drawEraser").addEventListener("click", () => setDrawTool("eraser"));
  $("drawWidth").addEventListener("change", e => { drawWidth = Number(e.target.value) || 4; });

  $("drawColor").addEventListener("click", e => {
    e.stopPropagation();
    const colors = ["#1b1f27","#ffffff","#d64545","#e0642f","#d99a00","#2e9e5b","#0ea5e9","#5b63e8","#8b5cf6","#d946a6"];
    openPopover($("drawColor"), colors.map(c => ({value:c,label:c})), c => {
      drawColor=c;
      $("drawColorSwatch").style.background=c;
    });
  });

  const layer=$("drawingLayer");
  layer.addEventListener("pointerdown", e => {
    if(!drawMode || !pageObj()) return;
    e.preventDefault();
    layer.setPointerCapture(e.pointerId);
    if(drawTool === "eraser"){
      eraseAt(pointerPoint(e));
      drawingPointer={id:e.pointerId,eraser:true};
      return;
    }
    historyCapture();
    const width = drawTool === "highlighter" ? Math.max(drawWidth*2.5, 10) : drawWidth;
    const opacity = drawTool === "highlighter" ? .28 : 1;
    drawingPointer={id:e.pointerId,stroke:{points:[pointerPoint(e)],color:drawColor,width,opacity}};
    const p=drawingPage();
    p.drawing.push(drawingPointer.stroke);
    renderDrawings();
  });

  layer.addEventListener("pointermove", e => {
    if(!drawingPointer || drawingPointer.id !== e.pointerId) return;
    e.preventDefault();
    const pt=pointerPoint(e);
    if(drawingPointer.eraser){ eraseAt(pt); return; }
    const pts=drawingPointer.stroke.points;
    const last=pts[pts.length-1];
    if(!last || Math.hypot((pt[0]-last[0])*drawingSize().w,(pt[1]-last[1])*drawingSize().h) >= 1.2){
      pts.push(pt);
      renderDrawings();
    }
  });

  ["pointerup","pointercancel","pointerleave"].forEach(type => layer.addEventListener(type, e => {
    if(drawingPointer && drawingPointer.id === e.pointerId){
      if(!drawingPointer.eraser){
        const p=drawingPage();
        if(p && p.drawing.length){
          p.modified=Date.now();
          historyCapture();
          saveSoon();
          renderPages();
          updateMeta();
        }
      }
      drawingPointer=null;
    }
  }));

  window.addEventListener("resize", renderDrawings);
}

function syncToolbar(){
  const states = {
    bold:"bold", italic:"italic", underline:"underline", strike:"strikeThrough",
    subscript:"subscript", superscript:"superscript",
    alignLeft:"justifyLeft", alignCenter:"justifyCenter",
    alignRight:"justifyRight", alignJustify:"justifyFull",
    bullet:"insertUnorderedList", number:"insertOrderedList"
  };
  Object.keys(states).forEach(id => {
    const el = $(id);
    if(!el) return;
    let on = false;
    try { on = document.queryCommandState(states[id]); } catch(err){}
    el.classList.toggle("on", !!on);
  });

  try {
    const v = String(document.queryCommandValue("formatBlock") || "").toLowerCase();
    $("style").value = ["h1","h2","h3","blockquote","pre"].indexOf(v) >= 0 ? v : "";
  } catch(err){}
}

function saveHTML(){

  const a = document.createElement("a");

  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 600);
}

function extractNotebookPayload(text){
  const trimmed = String(text || "").trim();
  if(!trimmed) return null;
  if(trimmed.startsWith("{") || trimmed.startsWith("[")){
    return JSON.parse(trimmed);
  }
  const doc = new DOMParser().parseFromString(trimmed, "text/html");
  const node = doc.getElementById("notebook-data") ||
    doc.querySelector("script[type='application/json']");
  if(node && node.textContent.trim()){
    return JSON.parse(node.textContent);
  }
  const m = trimmed.match(/<script[^>]*id=["']notebook-data["'][^>]*>([\s\S]*?)<\/script>/i);
  if(m) return JSON.parse(m[1]);
  throw new Error("No notebook data found in that file.");
}

function normalizeImported(raw){
  if(!raw || typeof raw !== "object" || Array.isArray(raw)){
    throw new Error("That file is not a OneBook notebook.");
  }
  const notebooks = Array.isArray(raw.notebooks) ? raw.notebooks : [];
  if(!notebooks.length){
    throw new Error("That notebook has no books to import.");
  }
  const pages = (Array.isArray(raw.pages) ? raw.pages : []).map(p => {
    const modified = typeof p.modified === "number" ? p.modified : (Date.parse(p.modified) || Date.now());
    const created = typeof p.created === "number" ? p.created : (Date.parse(p.created) || modified);
    return {
      id: p.id || uid("p"),
      section: p.section || p.sectionId || "",
      title: p.title || "",
      favorite: !!p.favorite,
      created,
      modified,
      tags: Array.isArray(p.tags) ? p.tags : [],
      body: p.body || p.content || "",
      drawing: Array.isArray(p.drawing) ? p.drawing : []
    };
  });
  return {
    version: raw.version || 5,
    name: raw.name || "OneBook",
    notebooks,
    pages
  };
}

function applyImported(next){
  db = next;
  currentNotebook = db.notebooks[0] ? db.notebooks[0].id : null;
  currentSection = db.notebooks[0]?.sections?.[0]?.id || null;
  currentPage = null;
  Object.keys(openBooks).forEach(k => { delete openBooks[k]; });
  db.notebooks.forEach(n => { openBooks[n.id] = true; });
  renderAll();
}

function importHTMLFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const next = normalizeImported(extractNotebookPayload(String(reader.result || "")));
      const label = (next.name || file.name || "notebook");
      if(!confirm("Replace the open notebook with “" + label + "”? Unsaved changes in this tab will be lost.")) return;
      applyImported(next);
    } catch(err){
      alert("Could not import that file.\n" + (err && err.message ? err.message : err));
    }
  };
  reader.onerror = () => alert("Could not read that file.");
  reader.readAsText(file);
}

function downloadBlob(blob, filename){

function xmlEsc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));
}

function crc32(bytes){
  let crc = 0xffffffff;
  for(let i = 0; i < bytes.length; i++){
    crc ^= bytes[i];
    for(let j = 0; j < 8; j++) crc = (crc >>> 1) ^ (0xedb88320 & -(crc & 1));
  }
  return (crc ^ 0xffffffff) >>> 0;
}

function zipStore(files){
  const enc = new TextEncoder();
  const locals = [];
  const centrals = [];
  let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = typeof f.data === "string" ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const local = new Uint8Array(30 + name.length + data.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(8, 0, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, data.length, true);
    lv.setUint32(22, data.length, true);
    lv.setUint16(26, name.length, true);
    local.set(name, 30);
    local.set(data, 30 + name.length);
    locals.push(local);
    const central = new Uint8Array(46 + name.length);
    const cv = new DataView(central.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, name.length, true);
    cv.setUint32(42, offset, true);
    central.set(name, 46);
    centrals.push(central);
    offset += local.length;
  });
  const centralSize = centrals.reduce((n, x) => n + x.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);
  const out = new Uint8Array(offset + centralSize + 22);
  let p = 0;
  locals.forEach(x => { out.set(x, p); p += x.length; });
  centrals.forEach(x => { out.set(x, p); p += x.length; });
  out.set(eocd, p);
  return out;
}

function wmlRunsFromNode(node, marks){
  marks = marks || { b:false, i:false, u:false };
  if(node.nodeType === 3){
    const text = node.nodeValue.replace(/\u00a0/g, " ");
    if(!text) return "";
    const parts = text.split("\n");
    return parts.map((part, idx) => {
      let run = "<w:r>";
      if(marks.b || marks.i || marks.u){
        run += "<w:rPr>";
        if(marks.b) run += "<w:b/>";
        if(marks.i) run += "<w:i/>";
        if(marks.u) run += '<w:u w:val="single"/>';
        run += "</w:rPr>";
      }
      run += "<w:t xml:space=\"preserve\">" + xmlEsc(part) + "</w:t></w:r>";
      if(idx < parts.length - 1) run += "<w:r><w:br/></w:r>";
      return run;
    }).join("");
  }
  if(node.nodeType !== 1) return "";
  const tag = node.tagName.toLowerCase();
  if(tag === "br") return "<w:r><w:br/></w:r>";
  const next = {
    b: marks.b || tag === "b" || tag === "strong",
    i: marks.i || tag === "i" || tag === "em",
    u: marks.u || tag === "u"
  };
  let html = "";
  node.childNodes.forEach(ch => { html += wmlRunsFromNode(ch, next); });
  return html;
}

function wmlParagraphsFromEditor(){
  const root = $("editor");
  const blocks = [];
  const pushPara = (style, node) => {
    const runs = wmlRunsFromNode(node);
    blocks.push('<w:p>' + (style ? '<w:pPr><w:pStyle w:val="' + style + '"/></w:pPr>' : "") + (runs || "<w:r><w:t></w:t></w:r>") + "</w:p>");
  };
  const walk = nodes => {
    nodes.forEach(node => {
      if(node.nodeType === 3){
        if(node.nodeValue.trim()) pushPara("", node);
        return;
      }
      if(node.nodeType !== 1) return;
      const tag = node.tagName.toLowerCase();
      if(tag === "h1") pushPara("Heading1", node);
      else if(tag === "h2") pushPara("Heading2", node);
      else if(tag === "h3") pushPara("Heading3", node);
      else if(tag === "li" || tag === "p" || tag === "blockquote" || tag === "pre") pushPara("", node);
      else if(tag === "ul" || tag === "ol" || tag === "div") walk(node.childNodes);
      else pushPara("", node);
    });
  };
  walk(root.childNodes);
  if(!blocks.length) blocks.push("<w:p><w:r><w:t></w:t></w:r></w:p>");
  return blocks.join("");
}

  const docRels =

    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +

  const styles =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +

    '<w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:rPr><w:b/><w:sz w:val="32"/></w:rPr></w:style>' +
    '<w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:rPr><w:b/><w:sz w:val="26"/></w:rPr></w:style>' +

    "</w:styles>";
  const bytes = zipStore([
    { name:"[Content_Types].xml", data: contentTypes },

  );
  addItem(
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/><path d="M12 3v10"/><path d="m8 9 4 4 4-4"/></svg>',
    "Import data",
    () => $("importFile").click()
  );

  const sep = document.createElement("div");
  sep.className = "menuSep";
  menu.appendChild(sep);

  addItem(
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8 13h8M8 17h6"/></svg>',
    "Export current page",
    exportCurrentPage
  );

  document.body.appendChild(menu);
  cardMenu = menu;
  const r = anchor.getBoundingClientRect();
  const w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left)) + "px";
  menu.style.top  = Math.max(8, Math.min(window.innerHeight - h - 8, r.bottom + 6)) + "px";
}

/* ============================================================
   Theme
   ============================================================ */
const THEME_KEY = "onebook-theme";
function applyTheme(dark){
  document.documentElement.classList.toggle("dark", dark);
  store.set(THEME_KEY, dark ? "dark" : "light");
  $("themeToggle").innerHTML = dark ? ICON.sun : ICON.moon;
  $("themeToggle").title = dark ? "Switch to light mode" : "Switch to dark mode";
}

/* ============================================================
   Wiring
   ============================================================ */
function wire(){
  bindToolbar();
  bindDrawing();

  /* Toolbar / top bar actions */
  $("newPageSide").addEventListener("click", newPage);
  $("emptyNewPage").addEventListener("click", newPage);
  $("newSection").addEventListener("click", newSection);
  $("newNotebook").addEventListener("click", newNotebook);
  $("fileMenuBtn").addEventListener("click", e => {
    e.stopPropagation();
    if(cardMenu){ closeCardMenu(); return; }
    showFileMenu($("fileMenuBtn"));
  });
  $("importFile").addEventListener("change", e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    importHTMLFile(file);
  });

  $("notebookToggle").addEventListener("click", e => {
    e.stopPropagation();
    notebookCollapsed = !notebookCollapsed;
    store.set("onebook-notebook-collapsed", notebookCollapsed ? "1" : "0");
    applyNotebookPaneState();
  });

  $("allNotebooks").addEventListener("click", () => {
    searchTerm = "";
    $("search").value = "";
    db.notebooks.forEach(n => openBooks[n.id] = true);
    renderNotebooks();
  });

  $("themeToggle").addEventListener("click", () => {
    applyTheme(!document.documentElement.classList.contains("dark"));
  });

  /* Editing */
  $("pageTitle").addEventListener("input", () => { commit({ list:true }); historyCaptureSoon(); });
  $("tags").addEventListener("input", () => { commit({ meta:true }); historyCaptureSoon(); });
  $("editor").addEventListener("input", () => {
    commit();
    updateMeta();
    historyCaptureSoon();
  });

  /* Pasted HTML often carries an explicit black font colour from Office,
     browsers and other editors. In dark mode that inline colour wins over
     the editor's inherited colour and produces unreadable text. Preserve
     rich formatting, but discard only black/near-black foreground colours. */
  $("editor").addEventListener("paste", e => {
    const html = e.clipboardData && e.clipboardData.getData("text/html");
    const text = e.clipboardData && e.clipboardData.getData("text/plain");
    if(!html){
      if(text){
        e.preventDefault();
        document.execCommand("insertText", false, text);
      }
      return;
    }

    if(!document.documentElement.classList.contains("dark")) return;

    e.preventDefault();
    historyCapture();

    const box = document.createElement("div");
    box.innerHTML = html;

    box.querySelectorAll("*").forEach(el => {
      const style = el.style;
      if(style && style.color){
        const c = style.color.trim().toLowerCase().replace(/\s+/g, "");
        const black = c === "black" || c === "#000" || c === "#000000" ||
          c === "rgb(0,0,0)" || c === "rgba(0,0,0,1)";
        if(black) style.removeProperty("color");
      }

      if(el.getAttribute("color")){
        const c = el.getAttribute("color").trim().toLowerCase();
        if(c === "black" || c === "#000" || c === "#000000") el.removeAttribute("color");
      }
    });

    document.execCommand("insertHTML", false, box.innerHTML);
    commit();
    historyCapture();
    updateMeta();
  });

  $("editor").addEventListener("blur", saveData);

  /* Search */
  $("search").addEventListener("input", e => {
    searchTerm = e.target.value;
    renderNotebooks();
  });

  /* Global dismissal */
  document.addEventListener("click", () => { closeCardMenu(); closePopover(); });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape"){ closeCardMenu(); closePopover(); }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"){
      e.preventDefault();
      if(e.shiftKey) redoPage(); else undoPage();
      syncToolbar();
      return;
    }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y"){
      e.preventDefault();
      redoPage();
      syncToolbar();
      return;
    }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){
      e.preventDefault();
      saveHTML();
    }
  });
  window.addEventListener("beforeunload", saveData);
}

/* ============================================================
   Boot
   ============================================================ */
wire();

const stored = store.get(THEME_KEY);
const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
applyTheme(stored ? stored === "dark" : prefersDark);

$("textColorSwatch").style.background = lastTextColor;
$("drawColorSwatch").style.background = drawColor;
setDrawTool("pen");

renderAll();

})();
</script>
